name: Release & npm Publish

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Perform a dry-run release check without publishing to npm'
        required: true
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Build, Audit, and Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          registry-url: 'https://registry.npmjs.org'

      - name: Enable Corepack & Prepare pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.1.0 --activate
        shell: bash

      - name: Verify Environment Bootstrap & Release Runtime
        run: |
          echo "=== Node, npm & Package Manager Release Runtime Information ==="
          node --version
          npm --version
          pnpm --version
          corepack --version
        shell: bash

      - name: Validate Release Tag Invariants
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Git tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi
          echo "✔ Git tag v$TAG_VERSION matches package.json version $PKG_VERSION"
        shell: bash

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Full Quality Gate & Pre-Release Verification
        run: pnpm release:check

      - name: Publish to npm Registry
        if: ${{ !inputs.dry_run }}
        run: |
          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > ~/.npmrc
          fi
          npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        if: ${{ !inputs.dry_run && startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: create-odoo-app-*.tgz
