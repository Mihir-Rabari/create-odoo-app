name: Continuous Integration (CI)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Quality Gate (${{ matrix.os }} - Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: ['22.x']

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Enable Corepack & Prepare pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.1.0 --activate
        shell: bash

      - name: Verify Environment Bootstrap
        run: |
          echo "=== Node & Package Manager Bootstrap Information ==="
          node --version
          pnpm --version
          corepack --version
        shell: bash

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Agent Skills Standard Verification
        run: pnpm skills:check

      - name: Agent Skills Structural Linting
        run: pnpm skills:lint

      - name: Agent Skills Packaging Verification
        run: pnpm skills:pack --all

      - name: Code Linters
        run: pnpm lint

      - name: TypeScript Verification
        run: pnpm typecheck

      - name: Unit & Integration Tests (Coverage)
        run: pnpm test:coverage

      - name: Security & Adversarial Test Suite
        run: pnpm test:security

      - name: Generator Smoke Test
        run: pnpm test:smoke

      - name: Production Build
        run: pnpm build

      - name: Distributable Tarball Release Verification
        run: pnpm verify:release
