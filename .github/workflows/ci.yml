name: Continuous Integration (CI)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Quality Gate (${{ matrix.os }} - Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: ['20.x', '22.x']

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Agent Skills Standard Verification
        run: pnpm skills:check

      - name: Code Linters
        run: pnpm lint

      - name: TypeScript Verification
        run: pnpm typecheck

      - name: Unit & Integration Tests (Coverage)
        run: pnpm test:coverage

      - name: Security & Adversarial Test Suite
        run: pnpm test:security

      - name: Generator Smoke Test
        run: pnpm test:smoke

      - name: Production Build
        run: pnpm build

      - name: Distributable Tarball Release Verification
        run: pnpm verify:release
