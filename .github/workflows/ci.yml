name: Continuous Integration (CI)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Quality Gate (${{ matrix.os }} - Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: ['22.x']

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Enable Corepack & Prepare pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.1.0 --activate
        shell: bash

      - name: Verify Environment Bootstrap
        run: |
          echo "=== Node & Package Manager Bootstrap Information ==="
          node --version
          pnpm --version
          corepack --version
        shell: bash

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Agent Skills Standard Verification
        run: pnpm skills:check

      - name: Agent Skills Structural Linting
        run: pnpm skills:lint

      - name: Agent Skills Packaging Verification
        run: pnpm skills:pack --all

      - name: Dependency Vulnerability Audit
        run: pnpm audit --prod --audit-level moderate

      - name: Code Linters
        run: pnpm lint

      - name: TypeScript Verification
        run: pnpm typecheck

      - name: Unit & Integration Tests (Coverage)
        run: pnpm test:coverage


      - name: Security & Adversarial Test Suite
        run: pnpm test:security

      - name: Generator Smoke Test
        run: pnpm test:smoke

      - name: Production Build
        run: pnpm build

      - name: Distributable Tarball Release Verification
        run: pnpm verify:release

  # Migrations and the seed script are the first two commands a scaffolded project runs.
  # The quality gate has no database, so without this job a broken migration or a seed
  # that fails against a real Postgres would only ever surface for the user.
  #
  # Service containers are Linux-only on GitHub-hosted runners, hence a separate job
  # rather than a conditional service on the matrix above.
  database:
    name: Database Migration & Seed
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: app_db
          # Throwaway database, reachable only from this job's runner and destroyed with
          # it. `trust` means there is no password to hardcode here at all — preferable
          # to committing a placeholder credential that secret scanners then flag.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # No password component: the service container above authenticates with `trust`.
      DATABASE_URL: postgres://postgres@localhost:5432/app_db
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Enable Corepack & Prepare pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.1.0 --activate

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply Migrations
        run: pnpm db:migrate

      - name: Seed Baseline IAM
        run: pnpm db:seed

      - name: Seed Is Idempotent
        run: pnpm db:seed

      # Runs the IamService integration suite against the real Postgres/Redis
      # containers above (seeded, so ROOT/ADMIN/AdministratorPolicy exist). This is
      # the only CI job where these tests execute instead of skipping — see
      # packages/iam/src/service/iam-service.integration.test.ts and the DATABASE_URL
      # gate in vitest.config.ts for how the two stay in sync.
      - name: IAM Service Integration Tests
        run: pnpm test:coverage -- packages/iam
